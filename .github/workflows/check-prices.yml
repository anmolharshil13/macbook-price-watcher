name: Check MacBook prices

on:
  schedule:
    # Every 3 hours (UTC). 02:17 UTC = 07:47 IST, then 10:47, 13:47 ... IST.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Only send a test notification to the iPhone"
        type: boolean
        default: false
  push:
    paths: ["data/config.json"]   # re-check right after you change a URL in the app

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        if: ${{ inputs.test_push != true }}
        run: python -m unittest discover -s checker

      - name: Check prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TEST_PUSH: ${{ inputs.test_push == true && 'true' || 'false' }}
          PYTHONIOENCODING: utf-8
        run: python checker/check_prices.py

      - name: Save results
        if: ${{ inputs.test_push != true }}
        run: |
          git config user.name  "price-watcher-bot"
          git config user.email "price-watcher-bot@users.noreply.github.com"
          git add data/history.json data/alerts.json
          git diff --cached --quiet && exit 0
          git commit -m "Price check $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
